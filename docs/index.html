<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; connect-src 'self' https://gfvdata.goatcounter.com; img-src 'self' data: https://gfvdata.goatcounter.com; style-src 'self'; base-uri 'none'; form-action 'none'">
<title>Esportes para assistir: Cruzeiro, Fórmula 1 e CS2</title>
<meta name="description" content="Agenda pessoal dos jogos do Cruzeiro, das sessões da Fórmula 1 e das partidas de CS2, no horário de Brasília.">
<script>try{var t=localStorage.getItem("tema");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="stylesheet" href="css/estilo.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
<div class="envolve">
  <header class="topo">
    <h1>Esportes para assistir</h1>
    <button type="button" id="tema" aria-label="Trocar tema"></button>
  </header>
  <p class="aviso" id="aviso" aria-live="polite"></p>

  <section class="faixa" aria-labelledby="t-48h">
    <h2 id="t-48h">Próximas 48 h</h2>
    <div class="cartoes" id="faixa"></div>
  </section>

  <main>
    <section class="secao cruzeiro" id="sec-cruzeiro"><h2>Cruzeiro</h2><div class="corpo" id="lista-cruzeiro"></div></section>
    <section class="secao f1" id="sec-f1"><h2>Fórmula 1</h2><div class="corpo" id="lista-f1"></div></section>
    <section class="secao cs" id="sec-cs"><h2>CS2</h2><div class="corpo" id="lista-cs"></div></section>
  </main>

  <footer>
    <ul class="fontes" id="fontes"></ul>
    <p>Horários de Brasília. Dados: <a href="https://api.jolpi.ca" target="_blank" rel="noopener">Jolpica F1 (api.jolpi.ca)</a>,
      <a href="https://www.football-data.org" target="_blank" rel="noopener">football-data.org</a> e
      <a href="https://liquipedia.net" target="_blank" rel="noopener">Liquipedia (liquipedia.net)</a>, licença CC-BY-SA 3.0.</p>
    <p><a href="/app/">Baixar o app Android</a></p>
  </footer>
</div>
<script src="js/app.js"></script>
<script>window.goatcounter = { path: (p) => "/SportToWatch" + p };</script>
<script data-goatcounter="https://gfvdata.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
