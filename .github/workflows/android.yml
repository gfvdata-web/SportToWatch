name: Android — app

# Build oficial do app Android do Esportes (SportToWatch) (molde: app do Painel de Status e do bilbao).
# Roda quando o app ou este workflow mudam. Os testes usam uma resposta de exemplo própria
# (app/src/test/.../apoio/Apoio.kt); não leem arquivos do Worker.
on:
  push:
    branches: [main]
    # Tag app-vX.Y.Z publica o APK assinado (job "publicar") no KV do Worker
    # (esportes.gfvdata.com/app/, de onde o app se atualiza); não há GitHub Release.
    # Filtro de paths não vale para tags.
    tags: ["app-v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

# Push novo cancela o build anterior ainda em andamento do mesmo ramo.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testes, lint e APK de debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      # versionCode = número desta run: só cresce, então cada APK novo é
      # "mais novo" para o Android. O versionName é montado no passo "Versão".
      ORG_GRADLE_PROJECT_sporttowatchVersionCode: ${{ github.run_number }}
      APK: sporttowatch-debug-build${{ github.run_number }}.apk
    steps:
      - uses: actions/checkout@v7

      # JDK 21: o Robolectric exige 21 para simular Android 15+. O bytecode do
      # app continua Java 17 (compileOptions em app/build.gradle.kts).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Também confere o checksum do gradle-wrapper.jar contra a lista oficial.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Versão
        run: echo "ORG_GRADLE_PROJECT_sporttowatchVersionName=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Testes (JVM + Robolectric)
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Monta APK de debug
        run: |
          ./gradlew assembleDebug
          mkdir -p ../saida
          cp app/build/outputs/apk/debug/app-debug.apk "../saida/$APK"

      # archive: false → o artefato é o próprio .apk (sem .zip), baixável
      # direto pelo celular na página da run.
      - name: Publica APK como artefato
        uses: actions/upload-artifact@v7
        with:
          path: saida/${{ env.APK }}
          archive: false
          retention-days: 30

      - name: Resumo
        run: |
          TESTES=$(cat app/build/test-results/testDebugUnitTest/*.xml | grep -o '<testsuite [^>]*' | grep -o ' tests="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          {
            echo "### Esportes (SportToWatch) — APK de debug"
            echo ""
            echo "- Arquivo: \`$APK\`"
            echo "- Versão: \`${ORG_GRADLE_PROJECT_sporttowatchVersionName}-debug\` · build ${ORG_GRADLE_PROJECT_sporttowatchVersionCode}"
            echo "- Testes: **$TESTES passaram** · lint sem avisos"
            echo "- Baixe em **Artifacts**, no fim desta página."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Relatórios de testes e lint (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-build${{ github.run_number }}
          path: android/app/build/reports/
          retention-days: 14

  # Versão oficial: só em tag app-vX.Y.Z e só depois do job "build"
  # (testes + lint) passar no mesmo commit. Publica só no KV do Worker (sem
  # GitHub Release), então não precisa de escrita no repositório.
  publicar:
    name: APK assinado (KV do Worker)
    needs: build
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      ORG_GRADLE_PROJECT_sporttowatchVersionCode: ${{ github.run_number }}
      # Impressão digital SHA-256 do certificado da chave de release (dado
      # público). "PREENCHER" = ainda não fixada: o passo da assinatura só imprime o
      # valor do APK. Depois de conferir, colocar aqui: uma chave diferente impediria
      # a atualização por cima no celular.
      CERTIFICADO_SHA256: PREENCHER
      # Id do namespace KV "APKS" (o mesmo de kv_namespaces em worker/wrangler.jsonc).
      KV_APKS_ID: 4f684a56d4c34a8391b419345c0e0da1
      CLOUDFLARE_ACCOUNT_ID: 24bbd7ba409d9e38e4636846172bd76d
      BASE: https://esportes.gfvdata.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Versão a partir da tag
        run: |
          VERSAO="${GITHUB_REF_NAME#app-v}"
          if ! [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A tag precisa ser app-vX.Y.Z (recebida: $GITHUB_REF_NAME)"
            exit 1
          fi
          {
            echo "VERSAO=$VERSAO"
            echo "ORG_GRADLE_PROJECT_sporttowatchVersionName=$VERSAO"
            echo "APK=sporttowatch-v$VERSAO-build$GITHUB_RUN_NUMBER.apk"
          } >> "$GITHUB_ENV"

      - name: Keystore (dos secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_B64 não configurado"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_ARQUIVO=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Monta APK de release assinado
        env:
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_SENHA: ${{ secrets.ANDROID_KEY_SENHA }}
        run: |
          ./gradlew assembleRelease
          mkdir -p ../saida
          cp app/build/outputs/apk/release/app-release.apk "../saida/$APK"

      # Imprime sempre o SHA-256 do certificado do APK (para fixar em CERTIFICADO_SHA256)
      # e só compara quando ele já foi preenchido.
      - name: Confere a assinatura
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs "../saida/$APK" | tee assinatura.txt
          ENCONTRADO="$(grep -i 'certificate SHA-256 digest:' assinatura.txt | head -1 | sed -E 's/.*digest: *//' | tr 'A-F' 'a-f')"
          echo "SHA-256 do certificado do APK: $ENCONTRADO"
          echo "- SHA-256 do certificado: \`$ENCONTRADO\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CERTIFICADO_SHA256" = "PREENCHER" ]; then
            echo "::warning::CERTIFICADO_SHA256 ainda é PREENCHER: assinatura não conferida (valor acima)."
          elif [ "$ENCONTRADO" != "$(printf '%s' "$CERTIFICADO_SHA256" | tr 'A-F' 'a-f')" ]; then
            echo "::error::APK não está assinado pela chave oficial (esperado $CERTIFICADO_SHA256)"
            exit 1
          fi

      # Único destino do APK (sem GitHub Release): KV "APKS" do Worker sport-to-watch, de onde
      # ele serve /app/<apk> e /app/versao.json (worker/src/index.ts). O versao.json só é
      # gravado depois que o APK citado entrou. Ficam no KV os 3 APKs mais novos (por build).
      - name: Publica no KV do Worker (APK + versao.json)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN não configurado"
            exit 1
          fi
          if [ "$KV_APKS_ID" = "PREENCHER_AO_CRIAR" ]; then
            echo "::error::KV_APKS_ID ainda é PREENCHER_AO_CRIAR: colocar o id do namespace APKS no topo do job publicar"
            exit 1
          fi
          WRANGLER="npx --yes wrangler@4.150.0"

          # Apaga os APKs antigos, deixando os 3 de maior build.
          $WRANGLER kv key list --remote --namespace-id "$KV_APKS_ID" | sed -n '/^\[/,$p' > chaves.json
          jq -r '.[].name | select(test("^sporttowatch-v[0-9]+\\.[0-9]+\\.[0-9]+-build[0-9]+\\.apk$"))' chaves.json \
            | sed -E 's/^.*-build([0-9]+)\.apk$/\1 &/' | sort -n | awk '{print $2}' | head -n -3 > antigos.txt
          while IFS= read -r ANTIGO; do
            echo "Apagando $ANTIGO do KV"
            $WRANGLER kv key delete --remote --namespace-id "$KV_APKS_ID" "$ANTIGO" < /dev/null
          done < antigos.txt

          NOTAS="Esportes (SportToWatch) $VERSAO (build $GITHUB_RUN_NUMBER). Instale por cima da versão anterior, sem perder nada."
          $WRANGLER kv key put --remote --namespace-id "$KV_APKS_ID" "$APK" --path "../saida/$APK"
          jq -n --arg versao "$VERSAO" --argjson build "$GITHUB_RUN_NUMBER" --arg apk "$APK" \
            --arg notas "$NOTAS" --arg publicado_em "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versao: $versao, build: $build, apk: $apk, notas: $notas, publicado_em: $publicado_em}' > versao.json
          $WRANGLER kv key put --remote --namespace-id "$KV_APKS_ID" "versao.json" --path versao.json

          # O KV pode levar alguns segundos para aparecer em todos os pontos de presença.
          curl --fail -sS --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "$BASE/app/$APK"
          {
            echo "### Esportes (SportToWatch) $VERSAO publicado"
            echo ""
            echo "- Download: $BASE/app/$APK"
            echo "- Arquivo: \`$APK\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apaga o keystore do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
